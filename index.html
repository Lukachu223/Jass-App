<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chratze – Schweizer Jass</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase SDK – muss vor allem anderen geladen sein -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b0e16; --surface: #161b28; --surface2: #1f2638;
  --border: rgba(255,255,255,0.07);
  --gold: #ffb238; --gold-d: #d98a12; --gold-l: #ffd27a;
  --text: #eef1f6; --text-d: #8993ac;
  --red: #ff5d72; --green: #2ee6a6;
  --felt: #14503e; --felt-l: #1c6a52; --felt-rim: #07241b;
}
body { font-family:'Inter','Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow:hidden; user-select:none; }

/* TOP BAR */
#topbar { position:fixed; top:0; left:0; right:0; height:52px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 18px; z-index:10; backdrop-filter:blur(10px); }
.logo { font-size:1.15rem; font-weight:800; color:var(--gold); letter-spacing:0.3px; cursor:pointer; }
#round-tag { font-size:0.68rem; color:var(--text-d); margin-top:2px; }
#home-btn { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text-d); border-radius:20px; padding:5px 14px; font-family:inherit; font-size:0.72rem; font-weight:600; cursor:pointer; transition:all 0.2s; display:none; }
#home-btn:hover { background:rgba(255,93,114,0.16); border-color:var(--red); color:var(--red); }
.pot-box { text-align:right; padding-top:6px; }
.pot-label { font-size:0.55rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-d); }
.pot-val { font-size:1.3rem; font-weight:800; color:var(--gold-l); line-height:1.1; }
#pot-breakdown { font-size:0.56rem; color:var(--text-d); }

/* SCORES BAR */
#scores { position:fixed; top:52px; left:0; right:0; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:6px 10px; background:var(--surface); border-bottom:1px solid var(--border); z-index:10; }
.sc { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:4px 12px; text-align:center; min-width:70px; }
.sc-name { font-size:0.6rem; font-weight:700; color:var(--gold); }
.sc-val { font-size:0.88rem; font-weight:700; }
.sc-val.pos{color:var(--green);} .sc-val.neg{color:var(--red);} .sc-val.zero{color:var(--text-d);}
.sc-tricks { font-size:0.53rem; color:var(--text-d); }

/* TABLE SCENE */
#scene { position:fixed; top:90px; left:0; right:0; bottom:180px; overflow:hidden; }
#table-wrap { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(520px,72vw); height:min(520px,72vw); }
#table-circle { width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 35% 35%, var(--felt-l), var(--felt) 55%, var(--felt-rim)); border:6px solid #04140e; box-shadow:0 0 0 3px #0c3527, 0 0 0 8px #04140e, 0 24px 70px rgba(0,0,0,0.6), inset 0 2px 16px rgba(255,255,255,0.04); position:relative; }

/* Trump + Pot outside table */
#trump-panel { display:none; }
#pot-on-table { display:none; }

/* INFO PANEL rechts */
#info-panel {
  position:fixed; top:96px; right:0; width:150px;
  background:var(--surface); border:1px solid var(--border);
  border-right:none; border-radius:16px 0 0 16px;
  padding:12px 14px; z-index:8; font-size:0.65rem; color:var(--text-d);
  display:flex; flex-direction:column; gap:8px;
  box-shadow:-6px 0 24px rgba(0,0,0,0.25);
}
.ip-section { display:flex; flex-direction:column; gap:2px; }
.ip-label { font-size:0.5rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-d); opacity:0.6; }
.ip-val { font-size:0.85rem; font-weight:700; color:var(--gold-l); }
.ip-sub { font-size:0.58rem; color:var(--text-d); line-height:1.6; }
.ip-divider { border:none; border-top:1px solid var(--border); margin:2px 0; }
#ip-blindauf-section { display:none; }
#ip-blindauf-section.show { display:flex; }

/* Trick center */
#trick-area { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-items:center; width:190px; }
#trick-winner { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:0.62rem; font-weight:700; color:var(--gold-l); white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,0.9); }

/* SEATS around table */
.seat { position:absolute; display:flex; flex-direction:column; align-items:center; gap:3px; transform:translate(-50%,-50%); transition:filter 0.3s; }
.seat.active { filter:drop-shadow(0 0 10px var(--gold)); }
.seat.out { opacity:0.32; }
.seat-label { font-size:0.62rem; font-weight:700; background:rgba(15,20,32,0.85); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:3px 10px; color:var(--text); white-space:nowrap; display:flex; align-items:center; gap:4px; backdrop-filter:blur(6px); }
.seat-label.active-lbl { border-color:var(--gold); color:var(--gold-l); }
.seat-cards { display:flex; gap:2px; }
.seat-info { font-size:0.53rem; color:var(--text-d); }

/* PLAYER HAND */
#hand-area { position:fixed; bottom:130px; left:0; right:0; display:flex; align-items:flex-end; justify-content:center; gap:6px; padding:0 12px; height:116px; pointer-events:none; }
.cw { display:inline-block; cursor:pointer; transition:transform 0.18s cubic-bezier(.34,1.56,.64,1); transform-origin:bottom center; pointer-events:all; }
.cw:hover { transform:translateY(-16px) scale(1.05); }
.cw.sel { transform:translateY(-22px) scale(1.07); filter:drop-shadow(0 0 8px rgba(226,184,74,0.8)); }
.cw.bad { opacity:0.3; cursor:not-allowed; } .cw.bad:hover { transform:none; }

/* FLYING CARD */
#card-flyer { position:fixed; pointer-events:none; z-index:50; display:none; }
#card-flyer.flying { transition:left 0.65s cubic-bezier(0.25,0.46,0.45,0.94), top 0.65s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.65s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.65s; }

/* ACTION BAR */
#action-bar { position:fixed; bottom:0; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 16px 10px; z-index:10; pointer-events:none; }
#action-msg { font-size:0.82rem; color:var(--text); line-height:1.4; text-align:center; background:rgba(15,20,32,0.78); border-radius:14px; padding:5px 16px; backdrop-filter:blur(8px); pointer-events:none; }
#action-msg strong{color:var(--gold-l);font-weight:700;} #action-msg em{color:var(--text-d);font-style:normal;}
#btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; pointer-events:all; }

/* LOG */
#log { position:fixed; left:10px; bottom:10px; width:200px; background:rgba(15,20,32,0.8); border-radius:12px; padding:6px 12px; font-size:0.6rem; color:var(--text-d); max-height:68px; overflow-y:auto; line-height:1.65; z-index:5; backdrop-filter:blur(6px); }
#stock-info { position:fixed; right:10px; bottom:10px; font-size:0.58rem; color:var(--text-d); z-index:5; }

/* BUTTONS */
.btn { font-family:inherit; font-size:0.8rem; font-weight:700; padding:9px 19px; border-radius:14px; border:none; cursor:pointer; transition:transform 0.1s,filter 0.1s,box-shadow 0.15s; box-shadow:0 2px 0 rgba(0,0,0,0.18); }
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);} .btn:active{transform:translateY(1px);box-shadow:0 0 0 rgba(0,0,0,0.18);}
.btn:disabled{opacity:0.32;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-gold{background:linear-gradient(135deg,#ffc861,#ff9d2e);color:#241200;}
.btn-red{background:linear-gradient(135deg,#ff7a8a,#e8344c);color:#fff;}
.btn-gray{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--border);box-shadow:none;}
.btn-green{background:linear-gradient(135deg,#5cf2c0,#15c990);color:#04241a;}

/* BADGES */
.badge{display:inline-block;font-size:0.53rem;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.b-g{background:#ff5d72;color:#fff;} .b-c{background:var(--gold);color:#241200;} .b-d{background:var(--green);color:#04241a;} .b-w{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.35);}

/* MODAL */
#overlay{display:none;position:fixed;inset:0;background:rgba(5,7,14,0.82);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
#overlay.show{display:flex;}
#modal{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:26px 26px;max-width:460px;width:92%;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
#modal h2{color:var(--gold);font-size:1.25rem;font-weight:800;margin-bottom:12px;text-align:center;}
#modal p{color:var(--text);line-height:1.65;font-size:0.84rem;margin-bottom:16px;}
#modal-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

/* ── LOBBY ── */
#lobby-overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%, #1c2440 0%, #0b0e16 70%);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);}
#lobby-box{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:32px 28px;max-width:440px;width:94%;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
#lobby-box h1{color:var(--gold);font-size:1.55rem;font-weight:800;text-align:center;margin-bottom:4px;}
.lobby-sub{color:var(--text-d);font-size:0.75rem;text-align:center;margin-bottom:22px;}
.by-line{font-family:'Dancing Script',cursive;font-weight:700;font-size:1.35rem;color:var(--gold-l);text-align:center;margin-top:-14px;margin-bottom:18px;opacity:0.9;letter-spacing:0.5px;}
.lobby-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--surface2);border-radius:14px;padding:4px;}
.ltab{flex:1;padding:9px;border-radius:11px;border:none;background:transparent;color:var(--text-d);cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:600;transition:all 0.2s;}
.ltab.active{background:var(--gold);color:#241200;}
.lobby-input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-family:inherit;font-size:0.9rem;margin-bottom:10px;outline:none;transition:border-color 0.2s;}
.lobby-input:focus{border-color:var(--gold);}
.lobby-code-big{text-align:center;font-size:2.8rem;font-weight:800;color:var(--gold);letter-spacing:14px;margin:14px 0;font-family:'Courier New',monospace;background:rgba(255,178,56,0.08);border-radius:16px;padding:14px;}
#lobby-player-list{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-height:32px;}
.lp-row{padding:9px 12px;background:var(--surface2);border-radius:12px;display:flex;align-items:center;gap:8px;font-size:0.82rem;}
.lp-host{font-size:0.55rem;background:rgba(255,178,56,0.18);color:var(--gold);border-radius:10px;padding:1px 7px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.lp-me{font-size:0.55rem;background:rgba(46,230,166,0.18);color:var(--green);border-radius:10px;padding:1px 7px;font-weight:700;}
.lobby-settings{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:0.8rem;display:flex;align-items:center;gap:8px;}
.lobby-settings label{color:var(--text-d);}
.lobby-settings input{width:72px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-family:inherit;text-align:center;outline:none;}
.lobby-hint{font-size:0.68rem;color:var(--text-d);text-align:center;margin-top:10px;line-height:1.7;}
.lobby-err{color:var(--red);font-size:0.75rem;text-align:center;margin-bottom:8px;min-height:18px;}

/* ══════════════════════════════════════════════
   MOBILE LAYOUT  (max-width: 600px)
   Desktop bleibt vollständig unverändert.
   ══════════════════════════════════════════════ */
@media (max-width: 600px) {

  /* ── Top Bar: kompakter ── */
  #topbar { height:44px; padding:0 10px; }
  .logo { font-size:1rem; }
  #round-tag { font-size:0.58rem; }
  .pot-val { font-size:1.05rem; }
  #home-btn { padding:4px 9px; font-size:0.68rem; }

  /* ── Scores-Toggle Button (nur mobile) ── */
  #scores-toggle-btn {
    display:flex; align-items:center; justify-content:center; gap:3px;
    position:fixed; top:48px; left:6px; z-index:11;
    width:auto; height:24px; padding:0 8px;
    border-radius:14px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text-d);
    font-size:0.62rem; font-weight:600; cursor:pointer;
  }

  /* ── Scores Bar: scrollbar horizontal statt umbrechen, einklappbar ── */
  #scores {
    top:44px;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    justify-content:flex-start;
    padding:3px 6px 3px 86px; /* Platz für Toggle-Button links */
    gap:4px;
    scrollbar-width:none;
  }
  #scores::-webkit-scrollbar { display:none; }
  .sc { min-width:62px; flex-shrink:0; padding:2px 7px; }
  .sc-name { font-size:0.56rem; }
  .sc-val { font-size:0.8rem; }
  .sc-tricks { font-size:0.48rem; }

  body.scores-collapsed #scores { display:none; }
  body.scores-collapsed #scene { top:44px; }
  body:not(.scores-collapsed) #scene { top:80px; }

  /* ── Info Panel: schwebende Karte oben-rechts über dem Tisch,
       deckt Hand / Buttons / Log nicht ab ── */
  #info-panel {
    position:fixed;
    top:auto; left:auto;
    bottom:206px; right:8px;
    width:168px;
    border-radius:16px;
    border:1px solid var(--border);
    flex-direction:column;
    gap:6px;
    padding:9px 11px;
    font-size:0.6rem;
    z-index:11;
    background:rgba(31,38,56,0.97);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    display:none; /* wird via JS gesteuert – standardmässig ausgeblendet */
  }
  #info-panel.mobile-visible {
    display:flex;
  }
  .ip-section { flex-direction:column; align-items:flex-start; gap:2px; }
  .ip-label { font-size:0.5rem; white-space:nowrap; }
  .ip-val { font-size:0.85rem; }
  .ip-sub { font-size:0.58rem; }
  .ip-divider { display:block; border-top:1px solid var(--border); margin:1px 0; }
  /* Trumpfkarte deutlich grösser anzeigen */
  #ip-trump-card img, #ip-trump-card svg { width:46px !important; height:66px !important; border-radius:5px; }
  #ip-trump-card { display:flex; align-items:center; gap:8px; }

  /* ── Blind-AUF Karte: grösser, eigene Sektion im Info-Panel ── */
  #ip-blindauf-section { display:none; }
  #ip-blindauf-section.show { display:flex; }
  #ip-blindauf-card img, #ip-blindauf-card svg { width:46px !important; height:66px !important; border-radius:5px; }
  #ip-blindauf-card { display:flex; align-items:center; gap:8px; }

  /* ── Info-Toggle Button (nur mobile) ── */
  #info-toggle-btn {
    display:flex;
    position:fixed;
    bottom:130px;
    right:8px;
    z-index:12;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:20px;
    padding:4px 9px;
    font-size:0.62rem;
    color:var(--text-d);
    cursor:pointer;
    align-items:center;
    gap:4px;
    backdrop-filter:blur(4px);
  }
  #info-toggle-btn.active { color:var(--gold-l); border-color:var(--gold); }

  /* ── Moderner Hintergrund ── */
  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(255,178,56,0.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(46,230,166,0.07), transparent 45%),
      linear-gradient(165deg, #11182a, #0b0e16 60%);
  }

  /* ── Spieltisch Scene ── */
  #scene {
    bottom:196px; /* Platz für Hand + Action */
    overflow:hidden;
    transition:top 0.2s;
  }
  #table-wrap {
    width:min(360px, 94vw);
    height:min(360px, 94vw);
  }
  /* Eckiger Tisch statt rund: Quadrat (3/4 Spieler) oder Hexagon (5/6 Spieler) */
  #table-circle {
    border-radius:8px;
    box-shadow:0 0 0 3px #1a3828, 0 0 0 7px #081510, 0 18px 50px rgba(0,0,0,0.6);
  }
  #table-circle.shape-square { border-radius:8px; clip-path:none; }
  #table-circle.shape-hex {
    border-radius:0;
    border:none;
    box-shadow:none;
    background:transparent;
    clip-path:none; /* wichtig: nicht auf #table-circle, sonst werden Sitze abgeschnitten */
  }
  #table-circle.shape-hex::before {
    content:'';
    position:absolute; inset:0; z-index:0;
    background:radial-gradient(circle at 35% 35%, var(--felt-l), var(--felt) 55%, var(--felt-rim));
    box-shadow:inset 0 0 0 7px #081510, inset 0 0 0 10px #1a3828;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,0.6));
    clip-path:polygon(75% 100%, 25% 100%, 0% 50%, 25% 0%, 75% 0%, 100% 50%);
  }
  #trick-area { width:230px; gap:6px; }

  /* ── Seats: an den Tischkanten, Karten knapp am Bildschirmrand ── */
  .seat-label { font-size:0.55rem; padding:2px 6px; white-space:nowrap; }
  .seat-info { font-size:0.46rem; }
  .seat-cards {
    /* Karten werden gefächert (überlappend) statt nebeneinander angezeigt – siehe JS */
    overflow:visible;
    justify-content:center;
    min-height:48px;
  }
  .seat-cards .fan-card {
    margin-left:-24px;
    transition:transform 0.2s;
  }
  .seat-cards .fan-card:first-child { margin-left:0; }
  .seat.blind-auf { filter:drop-shadow(0 0 10px var(--gold-l)); }

  /* ── Hand Area: grössere Karten, gefächert (überlappend) ── */
  #hand-area {
    bottom:104px;  /* über action-bar */
    height:128px;
    gap:0;
    padding:0 4px;
    align-items:flex-end;
  }
  .fan-wrap {
    display:inline-block;
    transform-origin:bottom center;
    margin-left:-14px;
  }
  .fan-wrap:first-child { margin-left:0; }
  .fan-wrap:has(.sel) { z-index:30; position:relative; }
  .cw:hover { transform:none; }
  .cw.sel  { transform:translateY(-20px) scale(1.06); }

  /* ── Action Bar: kompakter, kein Überlapp ── */
  #action-bar {
    padding:5px 10px 6px;
    gap:4px;
    bottom:0;
  }
  #action-msg { font-size:0.75rem; padding:3px 10px; }
  .btn { font-size:0.75rem; padding:6px 13px; }

  /* ── Log: kleiner, oben-links, nicht über Hand ── */
  #log {
    bottom:auto;
    top:82px;
    left:4px;
    width:160px;
    max-height:46px;
    font-size:0.55rem;
    padding:3px 7px;
    opacity:0.75;
  }
  body.scores-collapsed #log { top:48px; }

  /* ── Stock Info: verstecken auf mobile (ist im info-panel) ── */
  #stock-info { display:none; }

  /* ── Lobby: volle Breite ── */
  #lobby-box { padding:22px 16px; border-radius:14px; width:97%; }
  #lobby-box h1 { font-size:1.3rem; }
  .lobby-code-big { font-size:2.2rem; letter-spacing:10px; padding:10px; }

  /* ── Modal: sicher im viewport ── */
  #modal { padding:20px 16px; border-radius:12px; max-width:96vw; }
  #modal h2 { font-size:1.1rem; }
  #modal p { font-size:0.8rem; }
}
</style>
</head>
<body>

<div id="topbar">
  <div><div class="logo" onclick="confirmHome()">&#9827; Chratze</div><div id="round-tag">–</div></div>
  <button id="home-btn" onclick="confirmHome()">🏠 Lobby</button>
  <div class="pot-box"><div class="pot-label">Pot</div><div class="pot-val" id="pot-val">Fr. 0.00</div></div>
</div>
<div id="scores-toggle-btn" style="display:none" onclick="toggleScores()">📊 <span id="scores-toggle-label">Stände</span></div>
<div id="scores"></div>

<div id="scene">
  <div id="table-wrap">
    <div id="table-circle">
      <div id="trick-area"><div id="trick-winner"></div></div>
    </div>
  </div>
</div>

<div id="info-panel">
  <div class="ip-section">
    <div class="ip-label">Trumpf</div>
    <div class="ip-val" id="ip-trump-suit">–</div>
    <div id="ip-trump-card" style="margin-top:3px;"></div>

  authDomain:        "jass---chratzere.firebaseapp.com",

<script>
// ═══════════════════════════════════════════════════════════════
//  SCHWEIZER JASSKARTEN – Echte GIF-Bilder aus cards/ Ordner
// ═══════════════════════════════════════════════════════════════
var SUITS = [
  { name:'Eicheln',  prefix:'eichel'   },
  { name:'Schellen', prefix:'schellen' },
  { name:'Rosen',    prefix:'rosen'    },
  { name:'Schilten', prefix:'schilten' }
];
var RANKS      = ['A','K','O','U','10','9','8','7','6'];
var RNAMES     = ['Ass','König','Ober','Under','Banner','9','8','7','6'];
var RANK_FILES = ['ass','koenig','ober','under','banner','neun','acht','sieben','sechs'];

var _imgCache = {};
(function(){
  for(var s=0;s<4;s++) for(var r=0;r<9;r++){
    var key=s+'_'+r, img=new Image();
    img.src='cards/'+SUITS[s].prefix+'-'+RANK_FILES[r]+'.gif';
    _imgCache[key]=img;
  }
})();

function backSVG(W,H){
  var uid='bk'+W+'x'+H;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
    +'<defs><pattern id="bp'+uid+'" width="10" height="10" patternUnits="userSpaceOnUse">'
    +'<rect width="10" height="10" fill="#1a2a5e"/>'
    +'<path d="M0,5 L5,0 L10,5 L5,10 Z" fill="none" stroke="#2a4080" stroke-width="0.8"/>'
    +'<circle cx="5" cy="5" r="1.5" fill="#2244a0" opacity="0.6"/>'
    +'</pattern></defs>'
    +'<rect x="0.5" y="0.5" width="'+(W-1)+'" height="'+(H-1)+'" rx="6" fill="#0e1a48" stroke="#060e28" stroke-width="1.5"/>'
    +'<rect x="3" y="3" width="'+(W-6)+'" height="'+(H-6)+'" rx="4" fill="url(#bp'+uid+')"/>'
    +'<rect x="5" y="5" width="'+(W-10)+'" height="'+(H-10)+'" rx="3" fill="none" stroke="#c8a84b" stroke-width="1.4"/>'
    +'<text x="'+(W/2)+'" y="'+(H/2+5)+'" text-anchor="middle" font-family="Georgia,serif" font-size="'+(W*.22)+'" fill="#c8a84b" opacity="0.55">&#9670;</text>'
    +'</svg>';
}
var _backCache={};
function makeBack(w,h){
  var key='bk_'+w+'_'+h;
  if(!_backCache[key]){
    var div=document.createElement('div');div.innerHTML=backSVG(w,h);
    _backCache[key]=div.innerHTML;
  }
  var d2=document.createElement('div');d2.innerHTML=_backCache[key];
  var el=d2.firstElementChild;
  el.style.borderRadius='5px';el.style.display='block';
  return el;
}
function makeCard(suit,rank,w,h){
  var wrap=document.createElement('div');
  wrap.style.cssText='width:'+w+'px;height:'+h+'px;border-radius:5px;overflow:hidden;box-shadow:2px 3px 8px rgba(0,0,0,0.55);display:block;flex-shrink:0;background:#fff;';
  var img=document.createElement('img');
  img.src='cards/'+SUITS[suit].prefix+'-'+RANK_FILES[rank]+'.gif';
  img.style.cssText='width:'+w+'px;height:'+h+'px;display:block;object-fit:fill;';
  img.alt=RNAMES[rank]+' '+SUITS[suit].name;
  wrap.appendChild(img);
  return wrap;
}
</script>

<script>
// ═══════════════════════════════════════════════
//  MULTIPLAYER STATE
// ═══════════════════════════════════════════════
var MP = {
  active:           false,   // Multiplayer-Modus aktiv?
  isHost:           false,   // Bin ich Host?
  myIndex:          0,       // Mein Spieler-Index
  roomCode:         '',
  db:               null,
  roomRef:          null,
  stateRef:         null,
  moveRef:          null,
  waitingForMove:   null,    // Callback auf nächsten Move
  playerNames:      []
};

// Mein Spieler-Index (0 im Solo-Modus, MP.myIndex im MP-Modus)
function myPI(){ return MP.active ? MP.myIndex : 0; }

// ── Firebase / Lobby ──────────────────────────────────────────

function fbReady(){
  try {
    if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey==='DEIN_API_KEY'){
      lerr('c','Firebase nicht konfiguriert.');
      lerr('j','Firebase nicht konfiguriert.');
      return false;
    }
    if(typeof firebase === 'undefined'){
      lerr('c','Firebase SDK nicht geladen. Bitte Seite neu laden.');
      lerr('j','Firebase SDK nicht geladen. Bitte Seite neu laden.');
      return false;
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    MP.db = firebase.database();
    return true;
  } catch(e) {
    lerr('c','Firebase Fehler: '+e.message);
    lerr('j','Firebase Fehler: '+e.message);
    return false;
  }
}

function genCode(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  for(var i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)];
  return s;
}

function lerr(side,msg){ var el=document.getElementById('lerr-'+side); if(el) el.textContent=msg||''; }

function lobbyTab(tab){
  ['solo','create','join'].forEach(function(t){
    document.getElementById('ltab-'+t).classList.toggle('active', t===tab);
    document.getElementById('lsec-'+t).style.display = t===tab ? '' : 'none';
  });
  document.getElementById('lsec-wait').style.display='none';
  lerr('c',''); lerr('j','');
}

function lobbyStartSolo(){
  document.getElementById('lobby-overlay').style.display='none';
  showSetupDialog(startGame);
}

function lobbyCreate(){
  if(!fbReady()) return;
  var name=(document.getElementById('lname-c').value||'').trim()||'Spieler 1';
  lerr('c','');
  var code=genCode();
  MP.roomCode=code; MP.isHost=true; MP.myIndex=0; MP.active=true;
  MP.roomRef = MP.db.ref('rooms/'+code);
  MP.stateRef = MP.roomRef.child('state');
  MP.moveRef  = MP.roomRef.child('move');

  MP.roomRef.set({
    players:{ 0:{ name:name, index:0 } },
    started:false
  });

  showLobbyWait(code, true);
  listenLobbyPlayers();
}

function lobbyJoin(){
  if(!fbReady()) return;
  var name=(document.getElementById('lname-j').value||'').trim()||'Spieler';
  var code=(document.getElementById('lcode-j').value||'').trim().toUpperCase();
  lerr('j','');
  if(code.length!==4){ lerr('j','Bitte 4-stelligen Raumcode eingeben.'); return; }

  var ref=MP.db.ref('rooms/'+code);
  ref.once('value', function(snap){
    var room=snap.val();
    if(!room){ lerr('j','Raum "'+code+'" nicht gefunden.'); return; }
    if(room.started){ lerr('j','Dieses Spiel läuft bereits.'); return; }
    var taken=Object.keys(room.players||{}).map(Number);
    if(taken.length>=6){ lerr('j','Raum ist voll.'); return; }
    var next=1; while(taken.indexOf(next)!==-1) next++;

    MP.roomCode=code; MP.isHost=false; MP.myIndex=next; MP.active=true;
    MP.roomRef=ref;
    MP.stateRef=MP.roomRef.child('state');
    MP.moveRef =MP.roomRef.child('move');

    MP.roomRef.child('players/'+next).set({ name:name, index:next });
    showLobbyWait(code, false);
    listenLobbyPlayers();

    // Non-Host: auf Spielstart warten
    MP.roomRef.child('started').on('value', function(s){
      if(s.val()!==true) return;
      document.getElementById('lobby-overlay').style.display='none';
      listenGameState();
    });
  });
}

function showLobbyWait(code, isHost){
  ['solo','create','join'].forEach(function(t){
    document.getElementById('lsec-'+t).style.display='none';
    document.getElementById('ltab-'+t).classList.remove('active');
  });
  document.getElementById('lsec-wait').style.display='';
  document.getElementById('lcode-show').textContent=code;
  if(!isHost){
    document.getElementById('lstart-btn').style.display='none';
    document.getElementById('lsettings-host').style.display='none';
    document.getElementById('ladd-cpu-btn').style.display='none';
    document.getElementById('lhint').textContent='Verbunden! Warte auf den Host…';
  }
}

function listenLobbyPlayers(){
  MP.roomRef.child('players').on('value', function(snap){
    var players=snap.val()||{};
    var list=document.getElementById('lobby-player-list'); if(!list) return;
    list.innerHTML='';
    var count=0;
    Object.values(players).sort(function(a,b){return a.index-b.index;}).forEach(function(p){
      var row=document.createElement('div'); row.className='lp-row';
      row.innerHTML='<span style="color:var(--green);">●</span> <span style="flex:1">'+p.name+'</span>'
        +(p.index===0?'<span class="lp-host">Host</span>':'')
        +(p.index===MP.myIndex?'<span class="lp-me">Ich</span>':'');
      list.appendChild(row); count++;
    });
    var btn=document.getElementById('lstart-btn');
    if(btn && MP.isHost){
      btn.disabled=count<2;
      btn.textContent = count<2 ? 'Warte auf Spieler…' : 'Spiel starten ('+count+' Spieler)';
    }
    N=count;
  });
}

function lobbyStartGame(){
  if(!MP.isHost) return;
  var ei=parseFloat(document.getElementById('l-einsatz').value)||0.20;
  EINSATZ=Math.max(0.05,Math.min(10,Math.round(ei/0.05)*0.05));

  MP.roomRef.child('players').once('value', function(snap){
    var players=snap.val()||{};
    MP.playerNames=[];
    MP.cpuFlags=[];
    Object.values(players).sort(function(a,b){return a.index-b.index;}).forEach(function(p){
      MP.playerNames[p.index]=p.name;
      MP.cpuFlags[p.index]=!!p.isCPU;
    });
    N=MP.playerNames.length;
    for(var i=0;i<N;i++) if(!MP.playerNames[i]) MP.playerNames[i]='Spieler '+(i+1);

    MP.roomRef.child('settings').set({ einsatz:EINSATZ, playerNames:MP.playerNames, cpuFlags:MP.cpuFlags||[] });
    MP.roomRef.child('started').set(true);
    document.getElementById('lobby-overlay').style.display='none';
    listenForMoves();
    startGameMP();
  });
}

function lobbyAddCPU(){
  if(!MP.isHost||!MP.roomRef) return;
  MP.roomRef.child('players').once('value',function(snap){
    var players=snap.val()||{};
    var taken=Object.keys(players).map(Number);
    if(taken.length>=6){alert('Maximal 6 Spieler.');return;}
    var next=1; while(taken.indexOf(next)!==-1) next++;
    var cpuNames=['CPU Heidi','CPU Hans','CPU Vreni','CPU Ruedi','CPU Berta'];
    var cpuName=cpuNames[(next-1)%cpuNames.length];
    MP.roomRef.child('players/'+next).set({name:cpuName,index:next,isCPU:true});
  });
}


// ── Firebase State Sync ──────────────────────────────────────

function syncState(){
  if(!MP.active || !MP.isHost || !MP.stateRef) return;
  try {
    // Sicherstellen dass alle Werte Firebase-kompatibel sind (keine undefined)
    var toSync=JSON.parse(JSON.stringify(G, function(key, val){
      return val===undefined ? null : val;
    }));
    MP.stateRef.set(toSync);
  } catch(e){ console.error('syncState error:', e); }
}

function listenGameState(){
  // Non-Host: liest Einstellungen und hört auf State
  MP.roomRef.child('settings').once('value', function(snap){
    var s=snap.val()||{};
    EINSATZ=s.einsatz||0.20;
    MP.playerNames=s.playerNames||[];
    MP.cpuFlags=s.cpuFlags||[];
    N=MP.playerNames.length||5;
  });
  MP.stateRef.on('value', function(snap){
    var state=snap.val(); if(!state) return;
    var localSel=G.selCards||{};
    G=state;
    // Firebase speichert Arrays als Objekte – korrekt nach Index sortiert wiederherstellen
    function fbArr(obj){ if(!obj) return []; if(Array.isArray(obj)) return obj; return Object.keys(obj).sort(function(a,b){return Number(a)-Number(b);}).map(function(k){return obj[k];}); }
    if(!G.players) G.players=[];
    G.players=fbArr(G.players);
    G.players.forEach(function(p){
      p.hand=fbArr(p.hand);
      // Karten-Objekte korrekt wiederherstellen
      p.hand=p.hand.map(function(c){ return c&&typeof c==='object'?{suit:Number(c.suit),rank:Number(c.rank)}:c; });
    });
    G.trick=fbArr(G.trick).map(function(e){
      if(!e) return e;
      return {pidx:Number(e.pidx), card:{suit:Number(e.card.suit),rank:Number(e.card.rank)}};
    });
    G.stock=fbArr(G.stock).map(function(c){ return c?{suit:Number(c.suit),rank:Number(c.rank)}:c; });
    G.ansageOrder=fbArr(G.ansageOrder).map(Number);
    G.playOrder  =fbArr(G.playOrder).map(Number);
    G.swapOrder  =fbArr(G.swapOrder).map(Number);
    G.potContrib =G.potContrib||{};
    G.selCards   ={};
    if(G.phase==='tausch' && G.swapOrder[G.swapPtr]===MP.myIndex) G.selCards=localSel;
    // N aktualisieren
    N=G.players.length;
    render();
    checkMyTurnRemote();
  });
}

function checkMyTurnRemote(){
  if(!MP.active || MP.isHost) return;
  var mi=MP.myIndex;
  var p=G.players[mi]; if(!p) return;

  // Spectator mode: "Weg"-Spieler schauen nur zu
  if(p.status==='weg'){
    setMsg('<em>Du bist diese Runde Zuschauer.</em>');
    setBtns([]);
    return;
  }

  // Discard (5 Karten nach Tausch)
  if(G.awaitingDiscard===mi){
    renderHand();
    setMsg('<strong>5 Karten!</strong> Klicke auf eine zum verdeckt Ablegen.');
    setBtns([]);
    var wraps=document.querySelectorAll('#hand-area .cw');
    for(var i=0;i<wraps.length;i++){
      (function(idx,w){ w.classList.remove('bad');
        w.onclick=function(){ submitMove({type:'discard',cardIdx:idx}); setMsg('Warte…'); setBtns([]); disableHandClicks(); };
      })(i,wraps[i]);
    }
    return;
  }

  if(G.phase==='blindauf' && G.geber===mi){
    setMsg('<strong>Du bist Geber!</strong> Willst du <em>Blind AUF!</em> sagen, '
      +'<em>ohne</em> deine Karten anzusehen? Du erhältst dafür die Trumpfkarte <strong>'
      +cn(G.trumpCard)+'</strong> (für alle sichtbar) und musst danach eine Karte verdeckt ablegen.');
    setBtns([
      {label:'🙈 Blind AUF!',style:'gold',fn:function(){ submitMove({type:'blindauf'}); setMsg('Warte…'); setBtns([]); }},
      {label:'👀 Karten ansehen',style:'gray',fn:function(){ submitMove({type:'normal'}); setMsg('Warte…'); setBtns([]); }}
    ]);
  } else if(G.phase==='blindauf'){
    setMsg('Warte auf <strong>'+(G.players[G.geber]?G.players[G.geber].name:'?')+'</strong> (Geber)…'); setBtns([]);
  } else if(G.phase==='ansage' && G.ansageOrder[G.ansagePtr]===mi){
    setMsg('<strong>Ansage:</strong> Möchtest du <em>AUF!</em> (2 Stiche) oder <em>wegbleiben</em>?');
    setBtns([
      {label:'⚡ AUF!',style:'gold',fn:function(){ submitMove({type:'chratze'}); setMsg('Warte…'); setBtns([]); }},
      {label:'👋 Weg', style:'gray',fn:function(){ submitMove({type:'weg'});     setMsg('Warte…'); setBtns([]); }}
    ]);
  } else if(G.phase==='metcho' && G.ansageOrder[G.ansagePtr]===mi){
    var cname=G.players[G.chratzer]?G.players[G.chratzer].name:'?';
    setMsg('<strong>'+cname+'</strong> sagt AUF! – Willst du <em>mit</em> (1 Stich) oder <em>weg</em>?');
    setBtns([
      {label:'✅ Mit!',style:'green',fn:function(){ submitMove({type:'mit'});    setMsg('Warte…'); setBtns([]); }},
      {label:'👋 Weg', style:'gray', fn:function(){ submitMove({type:'weg_m'}); setMsg('Warte…'); setBtns([]); }}
    ]);
  } else if(G.phase==='tausch' && G.swapOrder[G.swapPtr]===mi){
    G.selCards={};
    renderHand();
    setMsg('<strong>Kartentausch:</strong> Karten anklicken, dann Tauschen drücken.<br><em>Alle 4 tauschen = 5 neue, 1 verdeckt ablegen.</em>');
    setBtns([
      {label:'🔄 Tauschen (0)',style:'gold',fn:function(){
        var idxs=selIndices();
        submitMove({type:'tausch',indices:idxs});
        setMsg('Warte…'); setBtns([]);
      }},
      {label:'▶ Nicht tauschen',style:'gray',fn:function(){
        submitMove({type:'tausch',indices:[]});
        setMsg('Warte…'); setBtns([]);
      }}
    ]);
    // Tauschen-Zähler aktualisieren
    var tBtn=document.querySelector('#btns .btn-gold');
    if(tBtn) tBtn.textContent='🔄 Tauschen ('+selIndices().length+')';
  } else if(G.phase==='play' && G.playOrder[G.playPtr]===mi){
    var led=G.trick.length>0?G.trick[0].card.suit:-1;
    var ln=led>=0?' · <em>Angespielt: '+SUITS[led].name+'</em>':'';
    setMsg('<strong>Dein Zug</strong>'+ln+' – gültige Karte anklicken.');
    setBtns([]);
    renderHand();
  } else if(G.awaitingContinue){
    var wname=G.players[G.trickWinner]?G.players[G.trickWinner].name:'?';
    setMsg('<strong>'+wname+'</strong> gewinnt Stich '+G.tricksTotal+'!'+(G.isLastTrick?' <em>Letzte Runde!</em>':''));
    setBtns([{
      label: G.isLastTrick ? '🏆 Rundenende' : '▶ Weiter',
      style: G.isLastTrick ? 'gold' : 'green',
      fn: function(){ submitMove({type:'continue'}); setMsg('Warte…'); setBtns([]); }
    }]);
  } else {
    // Nicht mein Zug
    var wmsg='Warte…';
    if(G.phase==='ansage'&&G.ansageOrder&&G.ansageOrder[G.ansagePtr]>=0){
      var ap=G.players[G.ansageOrder[G.ansagePtr]];
      wmsg='Warte auf <strong>'+(ap?ap.name:'?')+'</strong>…';
    } else if(G.phase==='metcho'&&G.ansageOrder&&G.ansageOrder[G.ansagePtr]>=0){
      var mp2=G.players[G.ansageOrder[G.ansagePtr]];
      wmsg='Warte auf <strong>'+(mp2?mp2.name:'?')+'</strong>…';
    } else if(G.phase==='tausch'&&G.swapOrder&&G.swapOrder[G.swapPtr]>=0){
      var tp=G.players[G.swapOrder[G.swapPtr]];
      wmsg=(tp?tp.name:'?')+' tauscht…';
    } else if(G.phase==='play'&&G.playOrder&&G.playOrder[G.playPtr]>=0){
      var pp=G.players[G.playOrder[G.playPtr]];
      wmsg='<strong>'+(pp?pp.name:'?')+'</strong> ist am Zug…';
    }
    setMsg(wmsg); setBtns([]);
  }
}

function listenForMoves(){
  if(!MP.isHost || !MP.moveRef) return;
  MP.moveRef.on('value', function(snap){
    var move=snap.val();
    if(!move || !MP.waitingForMove) return;
    var cb=MP.waitingForMove; MP.waitingForMove=null;
    if(MP._watchdog){clearInterval(MP._watchdog);MP._watchdog=null;}
    MP.moveRef.remove();
    cb(move);
  });
}

function waitForRemote(cb){
  MP.waitingForMove=cb;
  if(!MP.moveRef) return;

  function tryConsume(snap){
    var move=snap.val();
    if(!move || !MP.waitingForMove) return;
    MP.waitingForMove=null;
    if(MP._watchdog){clearInterval(MP._watchdog);MP._watchdog=null;}
    MP.moveRef.remove(); cb(move);
  }

  // Falls Move schon da
  MP.moveRef.once('value', tryConsume);

  // Watchdog: falls der .on-Listener ein Update verpasst (z.B. nach App-Wechsel
  // auf Mobilgeräten / kurzer Verbindungsunterbruch), alle 3s nachschauen,
  // solange noch auf einen Zug gewartet wird. Verhindert ein "Einfrieren" des Spiels.
  if(MP._watchdog) clearInterval(MP._watchdog);
  MP._watchdog=setInterval(function(){
    if(!MP.waitingForMove || !MP.moveRef){ clearInterval(MP._watchdog); MP._watchdog=null; return; }
    MP.moveRef.once('value', tryConsume);
  },3000);
}

function submitMove(move){
  if(MP.active && !MP.isHost && MP.moveRef) MP.moveRef.set(move);
}

function disableHandClicks(){
  var ws=document.querySelectorAll('#hand-area .cw');
  for(var i=0;i<ws.length;i++) ws[i].onclick=null;
}

function beats(ch,cu,led,tr){

// ── Mobile: eckiger Tisch – Spieler entlang den Tischkanten ──
// "Ich" sitze immer an der unteren Kante (Hand-Area). Die übrigen
// Spieler werden im Anzeige-Index 1..N-1 den restlichen Kanten zugeordnet.
// Quadrat (3/4 Spieler): links / oben / rechts – bei 3 bleibt "oben" frei.
// Hexagon (5/6 Spieler, flache Kante unten = ich): die 5 übrigen Kanten,
// bei 5 Spielern bleibt die obere (gegenüberliegende) Kante frei.
var MOBILE_EDGES = {
  3: [ {x:1,  y:50, rot:-90}, {x:99, y:50, rot:90} ],
  4: [ {x:1,  y:50, rot:-90}, {x:50, y:1,  rot:0 }, {x:99, y:50, rot:90} ],
  5: [ {x:12, y:75, rot:-90}, {x:12, y:25, rot:-90}, {x:88, y:25, rot:90}, {x:88, y:75, rot:90} ],
  6: [ {x:12, y:75, rot:-90}, {x:12, y:25, rot:-90}, {x:50, y:0,  rot:0 }, {x:88, y:25, rot:90}, {x:88, y:75, rot:90} ]
};
var MOBILE_TABLE_SHAPE = { 3:'shape-square', 4:'shape-square', 5:'shape-hex', 6:'shape-hex' };

function seatPos(playerIdx){
  var mi=myPI();
  // Anzeige-Index: 0=ich (hand-area), 1..N-1=andere um den Tisch
  var displayIdx=(playerIdx-mi+N)%N;
  var positions=SEAT_POSITIONS[N];
  if(positions&&positions[displayIdx]) return positions[displayIdx];
  var steps=N-1;
  var t=steps<=1?0.5:(displayIdx-1)/(steps-1);
  var angle=(200+t*140)%360;
  var rad=angle*Math.PI/180;
  return {x:50+44*Math.cos(rad),y:50+44*Math.sin(rad)};
}

function mobileEdgePos(playerIdx){
  var mi=myPI();
  var displayIdx=(playerIdx-mi+N)%N; // 1..N-1
  var edges=MOBILE_EDGES[N]||MOBILE_EDGES[6];
  return edges[displayIdx-1]||edges[edges.length-1];
}

function renderHand(){

        }

      (function(i){ wrap.onclick=function(){ toggleSel(i); }; })(idx);
    }
    target.appendChild(wrap);
  });
}

function flyCardToTable(cardEl,fromEl,callback){

    clone=makeCard(cardEl.suit,cardEl.rank,CW,CH);
  } else {
    var inner=fromEl.querySelector('img,svg,div');

  clone.style.cssText='width:'+CW+'px;height:'+CH+'px;border-radius:5px;box-shadow:4px 6px 16px rgba(0,0,0,0.7);display:block;';
  flyer.appendChild(clone);
  flyer.style.display='block'; flyer.style.transition='none';
  flyer.style.left=fromRect.left+'px'; flyer.style.top=fromRect.top+'px';
  flyer.style.transform='scale(1)'; flyer.style.opacity='1';
  var tx=taRect.left+taRect.width/2-CW/2;
  var ty=taRect.top+taRect.height/2-CH/2;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      flyer.classList.add('flying');
      flyer.style.left=tx+'px'; flyer.style.top=ty+'px';
      flyer.style.transform='scale(0.88)';
      setTimeout(function(){ flyer.style.display='none'; flyer.classList.remove('flying'); callback(); },680);
    });
  });
}

function startRound(){
  G.round++;G.chratzer=-1;G.trump=-1;G.trumpCard=null;G.trumpCardIdx=1;

    G.players.forEach(function(p,i){
      p.balance-=EINSATZ; G.pot=+(G.pot+EINSATZ).toFixed(2);
      G.potContrib[i]=(G.potContrib[i]||0)+EINSATZ;
      G.potContrib[i]=+G.potContrib[i].toFixed(2);
    });
    addLog('── Runde '+G.round+' · Grundeinsatz Fr. '+EINSATZ.toFixed(2)+' x'+N+' = Fr. '+G.pot.toFixed(2));
  } else {
    addLog('── Runde '+G.round+' · Pot bleibt: Fr. '+G.pot.toFixed(2)+' (kein Grundeinsatz)');
  }
  G.potStart=G.pot;
  dealCards();
}

function dealCards(){
  G.players.forEach(function(p){p.hand=[];p.tricks=0;p.status='none';});
  G.chratzer=-1;G.trick=[];G.selCards={};G.blindAufCard=null;G.blindAufPlayer=-1;
  var deck=shuffle(makeDeck()),idx=0;
  for(var pass=0;pass<2;pass++)
    for(var off=1;off<=N;off++)
      G.players[(G.geber-off+N*100)%N].hand.push(deck[idx++]);
  G.trumpCard=deck[idx++];G.trump=G.trumpCard.suit;G.trumpCardIdx=1;
  for(var pass2=0;pass2<2;pass2++)
    for(var off2=1;off2<=N;off2++)
      G.players[(G.geber-off2+N*100)%N].hand.push(deck[idx++]);
  G.stock=deck.slice(idx);
  addLog('Trumpf: '+SUITS[G.trump].name+' ('+cn(G.trumpCard)+') · Geber: '+G.players[G.geber].name);
  syncState(); render(); startBlindAuf();
}

// ── Blind AUF! (Zusatzregel) ─────────────────────────────
// Bevor der Geber seine Karten ansieht, kann er "Blind AUF!" sagen.
// Er erhält dafür die aufgedeckte Trumpfkarte (5. Karte, für alle sichtbar),
// muss sofort eine Karte verdeckt ablegen und ist danach Chratzer.
function startBlindAuf(){
  G.phase='blindauf'; syncState(); render();
  var geber=G.geber;

  if(geber===myPI()){
    setMsg('<strong>Du bist Geber!</strong> Willst du <em>Blind AUF!</em> sagen, '
      +'<em>ohne</em> deine Karten anzusehen? Du erhältst dafür die Trumpfkarte <strong>'
      +cn(G.trumpCard)+'</strong> (für alle sichtbar) und musst danach eine Karte verdeckt ablegen.');
    setBtns([
      {label:'🙈 Blind AUF!',style:'gold',fn:function(){doBlindAuf(geber);}},
      {label:'👀 Karten ansehen',style:'gray',fn:function(){skipBlindAuf(geber);}}
    ]);
  } else if(MP.active&&MP.isHost){
    if(!G.players[geber].isHuman){
      setTimeout(function(){ cpuDecideBlindAuf(geber); }, 700);
    } else {
      setMsg('Warte auf <strong>'+G.players[geber].name+'</strong> (Geber)…'); setBtns([]);
      waitForRemote(function(move){
        if(move.type==='blindauf') doBlindAuf(geber); else skipBlindAuf(geber);
      });
    }
  } else if(!MP.active){
    setTimeout(function(){ cpuDecideBlindAuf(geber); },700);
  }
  // Non-Host im MP-Modus: wartet passiv, checkMyTurnRemote zeigt Wartetext
}

function cpuDecideBlindAuf(pi){
  // Blind AUF! ist riskant (Karten unbekannt) – CPU macht das nur selten.
  if(Math.random()<0.08) doBlindAuf(pi); else skipBlindAuf(pi);
}

function skipBlindAuf(pi){
  addLog(G.players[pi].name+' (Geber) sieht seine Karten an – normaler Ablauf.');
  startAnsage();
}

function doBlindAuf(pi){
  G.players[pi].hand.push(G.trumpCard);
  G.blindAufCard={suit:G.trumpCard.suit,rank:G.trumpCard.rank};
  G.blindAufPlayer=pi;
  G.players[pi].status='chratzer'; G.chratzer=pi;
  addLog('🙈 '+G.players[pi].name+' geht BLIND AUF! und erhält '+cn(G.trumpCard)+' (für alle sichtbar).');
  syncState(); render();

  if(pi===myPI()){
    askDiscardBlind();
  } else if(MP.active&&MP.isHost){
    if(!G.players[pi].isHuman){
      setTimeout(function(){ discardWeakestBlind(pi); },500);
    } else {
      G.awaitingDiscard=pi; syncState(); render();
      waitForRemote(function(move){
        if(move.type==='discard'){
          G.players[pi].hand.splice(move.cardIdx,1);
          addLog(G.players[pi].name+' legt eine Karte verdeckt ab.');
          G.awaitingDiscard=-1;
          afterBlindAufDiscard();
        }
      });
    }
  } else if(!MP.active){
    setTimeout(function(){ discardWeakestBlind(pi); },500);
  }
}

function askDiscardBlind(){
  G.selCards={}; renderHand();
  setMsg('<strong>Blind AUF!</strong> Du hast jetzt 5 Karten – klicke eine zum verdeckt Ablegen.');
  setBtns([]);
  var wraps=document.querySelectorAll('#hand-area .cw');
  for(var i=0;i<wraps.length;i++){
    (function(idx,wrap){
      wrap.classList.remove('bad');
      wrap.onclick=function(){
        if(MP.active&&!MP.isHost){
          submitMove({type:'discard',cardIdx:idx});
          setMsg('Warte…'); setBtns([]); disableHandClicks();
        } else {
          G.players[myPI()].hand.splice(idx,1);
          addLog('Karte verdeckt abgelegt.');
          G.awaitingDiscard=-1;
          afterBlindAufDiscard();
        }
      };
    })(i,wraps[i]);
  }
}

function discardWeakestBlind(pi){
  var p=G.players[pi],wi=0,ws=Infinity;
  for(var i=0;i<p.hand.length;i++){var sc=evalC(p.hand[i],G.trump);if(sc<ws){ws=sc;wi=i;}}
  p.hand.splice(wi,1);
  afterBlindAufDiscard();
}

function afterBlindAufDiscard(){
  // Weiter wie nach normalem AUF!: alle anderen werden MIT/WEG gefragt.
  G.phase='metcho'; G.ansageOrder=[];
  for(var i=1;i<N;i++) G.ansageOrder.push((G.chratzer-i+N*100)%N);
  G.players.forEach(function(p,i){if(i!==G.chratzer&&p.status==='weg')p.status='none';});
  G.ansagePtr=0; syncState(); render(); setTimeout(nextMetcho,400);
}

function startAnsage(){
  G.phase='ansage';G.ansageOrder=[];
  for(var i=1;i<=N;i++) G.ansageOrder.push((G.geber-i+N*100)%N);
  G.ansagePtr=0; syncState(); render(); nextAnsage();
}

function nextAnsage(){
  if(G.ansagePtr>=G.ansageOrder.length){
    if(G.trumpCardIdx<3){revealNewTrump();return;}
    addLog('Niemand sagt AUF! – neu mischen! Alle zahlen Fr. '+EINSATZ.toFixed(2)+'.');
    G.players.forEach(function(p){p.balance-=EINSATZ;G.pot+=EINSATZ;});
    G.pot=+G.pot.toFixed(2); G.potStart=G.pot;
    syncState();
    showModal('Neu Mischen',
      'Niemand hat AUF! gesagt bei 3 Trumpfkarten!<br>Alle zahlen nochmals Fr. '+EINSATZ.toFixed(2)+' ein.<br><br>Pot: <strong>Fr. '+G.pot.toFixed(2)+'</strong>',
      [{label:'🔄 Neu mischen',style:'gold',fn:dealCards}]);
    return;
  }
  var pi=G.ansageOrder[G.ansagePtr]; syncState(); render();

  if(pi===myPI()){
    setMsg('<strong>Ansage:</strong> Möchtest du <em>AUF!</em> (2 Stiche) oder <em>wegbleiben</em>?');
    setBtns([
      {label:'⚡ AUF!',style:'gold',fn:function(){doChratze(myPI());}},
      {label:'👋 Weg', style:'gray',fn:function(){doWeg(myPI());}}
    ]);
  } else if(MP.active&&MP.isHost){
    if(!G.players[pi].isHuman){
      // CPU im MP-Modus
      setTimeout(function(){ cpuDecideChratze(pi); }, 700);
    } else {
      setMsg('Warte auf <strong>'+G.players[pi].name+'</strong>…');
      setBtns([]);
      waitForRemote(function(move){
        if(move.type==='chratze') doChratze(pi); else doWeg(pi);
      });
    }
  } else if(!MP.active){
    setTimeout(function(){
      cpuDecideChratze(pi);
    },700);
  }
}

function doChratze(pi){
  G.players[pi].status='chratzer'; G.chratzer=pi;
  addLog('⚡ '+G.players[pi].name+' AUF!');
  G.phase='metcho'; G.ansageOrder=[];
  for(var i=1;i<N;i++) G.ansageOrder.push((G.chratzer-i+N*100)%N);
  G.players.forEach(function(p,i){if(i!==pi&&p.status==='weg')p.status='none';});
  G.ansagePtr=0; syncState(); render(); setTimeout(nextMetcho,400);
}

function doWeg(pi){
  G.players[pi].status='weg';
  addLog(G.players[pi].name+': Weg.');
  G.ansagePtr++; syncState(); render(); setTimeout(nextAnsage,350);
}

function nextMetcho(){
  if(G.ansagePtr>=G.ansageOrder.length){
    var dabei=G.players.filter(function(p){return p.status==='dabei';});
    if(dabei.length===0){
      // Niemand geht mit -> Chratzer gewinnt Pot, alle zahlen Grundeinsatz
      chratzerAlone();
      return;
    }
    syncState(); render(); setTimeout(startTausch,400); return;
  }
  var pi=G.ansageOrder[G.ansagePtr], p=G.players[pi];
  syncState(); render();

  if(pi===myPI()){
    var wasWeg=p.status==='none';
    setMsg((wasWeg?'<em>Du warst weg – aber </em>':'')
      +'<strong>'+G.players[G.chratzer].name+'</strong> sagt AUF! – Willst du <em>mit</em> (1 Stich) oder <em>weg</em>?');
    setBtns([
      {label:'✅ Mit!', style:'green',fn:function(){doMetcho(myPI());}},
      {label:'👋 Weg', style:'gray', fn:function(){doWeg_m(myPI());}}
    ]);
  } else if(p.status==='weg'){
    G.ansagePtr++; setTimeout(nextMetcho,100);
  } else if(MP.active&&MP.isHost){
    if(!p.isHuman){
      setTimeout(function(){ cpuDecideMetcho(pi); }, 650);
    } else {
      setMsg('Warte auf <strong>'+p.name+'</strong>…'); setBtns([]);
      waitForRemote(function(move){
        if(move.type==='mit') doMetcho(pi); else doWeg_m(pi);
      });
    }
  } else if(!MP.active){
    setTimeout(function(){
      if(p.status==='none'||p.status==='dabei'){
        cpuDecideMetcho(pi);
      } else { G.ansagePtr++; setTimeout(nextMetcho,100); }
    },650);
  }
}

function doMetcho(pi){
  G.players[pi].status='dabei';
  addLog('✅ '+G.players[pi].name+' kommt mit.');
  G.ansagePtr++; syncState(); render(); setTimeout(nextMetcho,350);
}

function doWeg_m(pi){
  G.players[pi].status='weg';
  addLog(G.players[pi].name+': Weg.');
  G.ansagePtr++; syncState(); render(); setTimeout(nextMetcho,350);
}

function revealNewTrump(){
  G.trumpCardIdx++;
  if(!G.stock.length){addLog('Kein Stock – neu mischen!');dealCards();return;}
  var nc=G.stock.shift(); G.trumpCard=nc; G.trump=nc.suit;
  G.players.forEach(function(p){p.status='none';}); G.chratzer=-1;
  addLog('Neue Trumpfkarte ('+G.trumpCardIdx+'/3): '+SUITS[G.trump].name+' ('+cn(nc)+')');
  syncState(); render(); setTimeout(startAnsage,500);
}

function startTausch(){
  G.phase='tausch'; G.swapOrder=[G.chratzer];
  for(var i=1;i<N;i++){var pi=(G.chratzer-i+N*100)%N; if(G.players[pi].status==='dabei') G.swapOrder.push(pi);}
  G.swapPtr=0; G.selCards={}; syncState(); render(); setTimeout(nextTausch,300);
}

function nextTausch(){
  if(G.swapPtr>=G.swapOrder.length){syncState();render();setTimeout(startPlay,300);return;}
  var pi=G.swapOrder[G.swapPtr]; syncState(); render();

  if(pi===myPI()){
    G.selCards={}; renderHand();
    setMsg('<strong>Kartentausch:</strong> Karten anklicken zum Markieren, dann Tauschen drücken.<br><em>Alle 4 tauschen = 5 neue erhalten, 1 verdeckt ablegen.</em>');
    setBtns([
      {label:'🔄 Tauschen (0)',style:'gold',fn:doHumanSwap},
      {label:'▶ Nicht tauschen',style:'gray',fn:function(){execSwap(myPI(),[]);}}
    ]);
  } else if(MP.active&&MP.isHost){
    if(!G.players[pi].isHuman){
      setTimeout(function(){
        var p2=G.players[pi],td=[];
        for(var i=0;i<p2.hand.length;i++){if(p2.hand[i].suit!==G.trump&&p2.hand[i].rank!==0)td.push(i);}
        execSwap(pi,td.slice(0,Math.min(4,td.length)));
      },600);
    } else {
      setMsg(G.players[pi].name+' tauscht…'); setBtns([]);
      waitForRemote(function(move){
        if(move.type==='tausch') execSwap(pi,move.indices||[]);
        else if(move.type==='discard'){
          G.players[pi].hand.splice(move.cardIdx,1);
          addLog(G.players[pi].name+' legt Karte ab.');
          G.awaitingDiscard=-1;
          G.swapPtr++;G.selCards={};
          syncState();render();setTimeout(nextTausch,300);
        }
      });
    }
  } else if(!MP.active){
    setTimeout(function(){
      var p2=G.players[pi],td=[];
      for(var i=0;i<p2.hand.length;i++){if(p2.hand[i].suit!==G.trump&&p2.hand[i].rank!==0)td.push(i);}
      execSwap(pi,td.slice(0,Math.min(4,td.length)));
    },600);
  }
}

function doHumanSwap(){execSwap(myPI(),selIndices());}

function execSwap(pi,indices){
  var p=G.players[pi],n=indices.length;
  if(n===0){addLog(p.name+' tauscht nicht.');G.swapPtr++;G.selCards={};syncState();render();setTimeout(nextTausch,300);return;}
  indices.sort(function(a,b){return b-a;}).forEach(function(i){G.stock.push(p.hand.splice(i,1)[0]);});
  if(n===4){
    var nc=G.stock.splice(0,Math.min(5,G.stock.length)); p.hand=p.hand.concat(nc);
    addLog(p.name+' tauscht 4, erhält '+nc.length+'.');
    if(nc.length>=5){
      if(pi===myPI()){askDiscard();return;}
      else if(MP.active&&MP.isHost){
        // Non-Host muss ablegen: State syncen, dann auf Move warten
        G.awaitingDiscard=pi;
        syncState(); render();
        waitForRemote(function(move){
          if(move.type==='discard'){
            G.players[pi].hand.splice(move.cardIdx,1);
            addLog(G.players[pi].name+' legt Karte ab.');
            G.awaitingDiscard=-1;
            G.swapPtr++;G.selCards={};
            syncState();render();setTimeout(nextTausch,300);
          }
        });
        return;
      } else if(!G.players[pi].isHuman){
        discardWeakest(pi);return;
      }
    }
  } else {
    var nc2=G.stock.splice(0,Math.min(n,G.stock.length)); p.hand=p.hand.concat(nc2);
    addLog(p.name+' tauscht '+n+' Karte(n).');
  }
  G.swapPtr++;G.selCards={};syncState();render();setTimeout(nextTausch,300);
}

function askDiscard(){
  G.selCards={}; renderHand();
  setMsg('<strong>5 Karten!</strong> Klicke auf eine Karte zum verdeckt Ablegen.');
  setBtns([]);
  var wraps=document.querySelectorAll('#hand-area .cw');
  for(var i=0;i<wraps.length;i++){
    (function(idx,wrap){
      wrap.classList.remove('bad');
      wrap.onclick=function(){
        if(MP.active&&!MP.isHost){
          submitMove({type:'discard',cardIdx:idx});
          setMsg('Warte…'); setBtns([]); disableHandClicks();
        } else {
          G.players[myPI()].hand.splice(idx,1);
          addLog('Karte verdeckt abgelegt.');
          G.awaitingDiscard=-1;
          G.swapPtr++;G.selCards={};syncState();render();setTimeout(nextTausch,300);
        }
      };
    })(i,wraps[i]);
  }
}

function discardWeakest(pi){
  var p=G.players[pi],wi=0,ws=Infinity;
  for(var i=0;i<p.hand.length;i++){var sc=evalC(p.hand[i],G.trump);if(sc<ws){ws=sc;wi=i;}}
  p.hand.splice(wi,1);G.swapPtr++;syncState();render();setTimeout(nextTausch,300);
}

function startPlay(){
  G.phase='play'; G.trick=[]; G.tricksTotal=0; G.awaitingContinue=false;
  G.playOrder=[G.chratzer];
  for(var i=1;i<N;i++){var pi=(G.chratzer-i+N*100)%N; if(G.players[pi].status!=='weg') G.playOrder.push(pi);}
  G.playPtr=0;
  var expected=G.players[G.playOrder[0]].hand.length;
  addLog('── Spiel: '+G.playOrder.length+' Spieler, je '+expected+' Karten ──');
  syncState(); render(); nextPlay();
}

function nextPlay(){
  if(G.playPtr<G.playOrder.length){
    var pi=G.playOrder[G.playPtr]; syncState(); render();
    if(pi===myPI()){
      var led=G.trick.length>0?G.trick[0].card.suit:-1;
      var ln=led>=0?' · <em>Angespielt: '+SUITS[led].name+'</em>':'';
      setMsg('<strong>Dein Zug</strong>'+ln+' – gültige Karte anklicken.');
      setBtns([]); renderHand();
    } else if(MP.active&&MP.isHost){
      if(!G.players[pi].isHuman){
        setTimeout(function(){cpuPlay(pi);},850);
      } else {
        setMsg('<strong>'+G.players[pi].name+'</strong> ist am Zug…'); setBtns([]);
        waitForRemote(function(move){
          if(move.type==='playCard') processRemoteCard(pi,move.cardIdx,move.card);
        });
      }
    } else if(!MP.active){
      setTimeout(function(){cpuPlay(pi);},850);
    }
  } else {
    resolveTrick();
  }
}

function processRemoteCard(pi,cardIdx,cardObj){
  var p=G.players[pi];
  var idx=-1, card=null;

  // Bevorzugt: Karte anhand Farbe/Wert finden (robust gegen Index-Abweichungen
  // zwischen Host- und Client-Handreihenfolge)
  if(cardObj){
    for(var i=0;i<p.hand.length;i++){
      if(p.hand[i].suit===cardObj.suit && p.hand[i].rank===cardObj.rank){ idx=i; card=p.hand[i]; break; }
    }
  }
  // Fallback: per Index
  if(card===null && p.hand[cardIdx]){ idx=cardIdx; card=p.hand[cardIdx]; }

  if(card===null){
    // Letzter Fallback: niemals einfrieren – automatisch eine gültige Karte spielen
    // und das Problem im Log vermerken, damit das Spiel weiterläuft.
    addLog('⚠️ Synchronisationsproblem bei '+p.name+' – Zug wird automatisch fortgesetzt.');
    var legal=p.hand.filter(function(c){return isLegal(c,p.hand,G.trump);});
    if(!legal.length) legal=p.hand;
    if(!legal.length) return;
    card=legal[0]; idx=p.hand.indexOf(card);
  }

  p.hand.splice(idx,1);
  G.trick.push({pidx:pi,card:card});
  G.selCards={}; addLog(p.name+': '+cn(card)); G.playPtr++;
  syncState(); render(); setTimeout(nextPlay,500);
}

function isLegal(card,hand,trump){
  if(!G.trick.length)return true;
  var led=G.trick[0].card.suit, hasLed=false;
  for(var i=0;i<hand.length;i++) if(hand[i].suit===led){hasLed=true;break;}

  // Höchste bereits gespielte Trumpfkarte im aktuellen Stich (kleinster rank = stärkste Karte)
  var tableTrumps=G.trick.filter(function(e){return e.card.suit===trump;});
  var bestTableTrumpRank=tableTrumps.length
    ? Math.min.apply(null, tableTrumps.map(function(e){return e.card.rank;}))
    : null;

  if(card.suit===led){
    // Angespielte Farbe ist Trumpf: falls möglich, muss überstochen werden
    if(led===trump && bestTableTrumpRank!==null){
      var higherTr=hand.filter(function(c){return c.suit===trump&&c.rank<bestTableTrumpRank;});
      if(higherTr.length>0) return card.rank<bestTableTrumpRank;
    }
    return true;
  }
  if(!hasLed){
    var hasTr=false;
    for(var j=0;j<hand.length;j++) if(hand[j].suit===trump){hasTr=true;break;}
    if(hasTr){
      if(card.suit!==trump) return false;
      // Trumpfzwang: falls ein höherer Trumpf als der bisher beste auf dem Tisch
      // vorhanden ist, muss dieser gespielt werden.
      if(bestTableTrumpRank!==null){
        var higherTr2=hand.filter(function(c){return c.suit===trump&&c.rank<bestTableTrumpRank;});
        if(higherTr2.length>0) return card.rank<bestTableTrumpRank;
      }
      return true;
    }
    return true;
  }
  return false;
}

function playCard(idx){
  if(G.phase!=='play')return;
  var mi=myPI();
  if(G.playOrder[G.playPtr]!==mi)return;
  var p=G.players[mi],card=p.hand[idx];
  if(!isLegal(card,p.hand,G.trump)){
    setMsg('<strong style="color:#ff5d72">Ungültig!</strong> Farbe bekennen oder Trumpf spielen.');
    return;
  }
  var handEl=document.getElementById('hand-area');
  var cardWrap=handEl.querySelector('[data-idx="'+idx+'"]');
  p.hand.splice(idx,1);
  G.trick.push({pidx:mi,card:card});
  G.selCards={}; addLog((mi===0&&!MP.active?'Du':p.name)+' spielt: '+cn(card)); G.playPtr++;
  syncState(); renderHand();
  if(cardWrap){ flyCardToTable(card,cardWrap,function(){render();setTimeout(nextPlay,200);}); }
  else { render(); setTimeout(nextPlay,400); }
}

function trickBest(){
  var led=G.trick[0].card.suit, best=G.trick[0];
  G.trick.forEach(function(e){if(beats(e.card,best.card,led,G.trump))best=e;});
  return best;
}

function cpuPlay(pi){
  if(G.phase!=='play')return;
  if(G.playOrder[G.playPtr]!==pi)return;
  var p=G.players[pi];
  var led=G.trick.length>0?G.trick[0].card.suit:-1;
  var legal=p.hand.filter(function(c){return isLegal(c,p.hand,G.trump);});
  if(legal.length===0){legal=p.hand.slice();}
  var chosen;
  if(G.trick.length>0){
    var best=trickBest();
    var canWin=legal.filter(function(c){return beats(c,best.card,led,G.trump);});
    if(canWin.length>0&&((pi===G.chratzer&&p.tricks<2)||(p.status==='dabei'&&p.tricks<1))){
      canWin.sort(function(a,b){return b.rank-a.rank;});chosen=canWin[0];
    } else { legal.sort(function(a,b){return b.rank-a.rank;});chosen=legal[0]; }
  } else {
    if(pi===G.chratzer){
      var nt=legal.filter(function(c){return c.suit!==G.trump;});
      var pool=nt.length?nt:legal;
      pool.sort(function(a,b){return a.rank-b.rank;});chosen=pool[0];
    } else { legal.sort(function(a,b){return b.rank-a.rank;});chosen=legal[0]; }
  }
  var hi=p.hand.indexOf(chosen); p.hand.splice(hi,1);
  G.trick.push({pidx:pi,card:chosen}); addLog(p.name+': '+cn(chosen)); G.playPtr++;

  var seatEl=null;
  var seats=document.querySelectorAll('.seat');
  for(var si=0;si<seats.length;si++){
    var lbl=seats[si].querySelector('.seat-label');
    if(lbl&&lbl.textContent.indexOf(p.name)!==-1){seatEl=seats[si];break;}
  }
  var fromEl=seatEl?seatEl.querySelector('.seat-cards'):null;
  if(fromEl&&fromEl.firstChild){
    flyCardToTable(chosen,fromEl.firstChild,function(){syncState();render();setTimeout(nextPlay,200);});
  } else { syncState();render();setTimeout(nextPlay,500); }
}

function resolveTrick(){
  var best=trickBest();
  G.players[best.pidx].tricks++; G.tricksTotal++;
  addLog('🏆 Stich '+G.tricksTotal+' → '+G.players[best.pidx].name+' ('+cn(best.card)+')');
  document.getElementById('trick-winner').textContent='→ '+G.players[best.pidx].name+' gewinnt Stich '+G.tricksTotal+'!';

  var winner=best.pidx;
  var cardsLeft=G.players[winner].hand.length;
  var isLastTrick=(cardsLeft===0);
  var winnerName=G.players[winner].name;

  // State für alle sichtbar machen (inkl. Stich auf dem Tisch)
  G.awaitingContinue=true; G.trickWinner=winner; G.isLastTrick=isLastTrick;
  syncState(); render();

  setMsg('<strong>'+winnerName+'</strong> gewinnt Stich '+G.tricksTotal+'!'+(isLastTrick?' <em>Letzte Runde!</em>':''));

  function doContinue(){
    if(!G.awaitingContinue)return;
    G.awaitingContinue=false; G.trickWinner=-1;
    MP.waitingForMove=null; // Continue-Listener löschen
    var newOrder=[winner];
    for(var ni=1;ni<N;ni++){var npi=(winner-ni+N*100)%N; if(G.players[npi].status!=='weg')newOrder.push(npi);}
    G.playOrder=newOrder; G.playPtr=0; G.trick=[];
    syncState(); render();
    if(isLastTrick){ setTimeout(endRound,400); }
    else { document.getElementById('trick-winner').textContent=''; setTimeout(nextPlay,200); }
  }

  setBtns([{
    label: isLastTrick?'🏆 Rundenende':'▶ Weiter',
    style: isLastTrick?'gold':'green',
    fn: doContinue
  }]);

  // Host auch auf Remote-Continue hören (beliebiger Spieler kann klicken)
  if(MP.active&&MP.isHost){
    waitForRemote(function(move){ if(move.type==='continue') doContinue(); });
  }
}

function endRound(){
  G.phase='end';
  var chr=G.players[G.chratzer];
  var dabei=G.players.filter(function(p){return p.status==='dabei';});
  var dG=dabei.filter(function(p){return p.tricks>=1;});
  var dV=dabei.filter(function(p){return p.tricks<1;});
  var chrWon=chr.tricks>=2;
  var potStart=G.potStart;
  var lines=['<strong>'+chr.name+'</strong> sagt AUF!: '+chr.tricks+' Stich(e) | Pot: Fr. '+potStart.toFixed(2)+'.'];
  var anyPenalty=false;

  if(chrWon){
    var cs=+(potStart*2/3).toFixed(2); var rest=+(potStart-cs).toFixed(2);
    chr.balance+=cs; lines.push('✅ '+chr.name+' gewinnt Fr. '+cs.toFixed(2)+' (2/3).');
    if(dG.length>0){
      var sh=+(rest/dG.length).toFixed(2);
      dG.forEach(function(p){p.balance+=sh;});
      lines.push('✅ '+dG.map(function(p){return p.name;}).join(', ')+' teilen Fr. '+rest.toFixed(2)+' (1/3).');
    }
  } else {
    if(dG.length>0){
      var sh2=+(potStart/dG.length).toFixed(2);
      dG.forEach(function(p){p.balance+=sh2;});
      lines.push('✅ '+dG.map(function(p){return p.name;}).join(', ')+' teilen Fr. '+potStart.toFixed(2)+'.');
    }
  }

  G.pot=0; G.potContrib={};
  if(chrWon){
    dV.forEach(function(p){
      var idx2=G.players.indexOf(p); var pen=+potStart.toFixed(2);
      p.balance-=pen; G.pot=+(G.pot+pen).toFixed(2);
      G.potContrib[idx2]=(G.potContrib[idx2]||0)+pen;
      lines.push('❌ '+p.name+' zahlt Fr. '+pen.toFixed(2)+' (1× Pot).'); anyPenalty=true;
    });
  } else {
    var chrIdx=G.chratzer; var pen2=+(potStart*2).toFixed(2);
    chr.balance-=pen2; G.pot=+(G.pot+pen2).toFixed(2);
    G.potContrib[chrIdx]=(G.potContrib[chrIdx]||0)+pen2;
    lines.push('❌ '+chr.name+' zahlt Fr. '+pen2.toFixed(2)+' (2× Pot).'); anyPenalty=true;
    dV.forEach(function(p){
      var idx3=G.players.indexOf(p); var pen3=+potStart.toFixed(2);
      p.balance-=pen3; G.pot=+(G.pot+pen3).toFixed(2);
      G.potContrib[idx3]=(G.potContrib[idx3]||0)+pen3;
      lines.push('❌ '+p.name+' zahlt Fr. '+pen3.toFixed(2)+' (1× Pot).'); anyPenalty=true;
    });
  }

  G.pot=+G.pot.toFixed(2);
  G.needsEinsatz=!anyPenalty;
  if(anyPenalty){
    lines.push('<em style="color:#ffb238">Neuer Pot: Fr. '+G.pot.toFixed(2)+' – kein Grundeinsatz nächste Runde.</em>');
  } else {
    G.potContrib={};
    lines.push('<em style="color:#ffb238">Pot leer – Grundeinsatz nächste Runde.</em>');
  }

  G.geber=(G.geber-1+N)%N;
  syncState(); render();

  var nextRoundBtns=[
    {label:'🃏 Nächste Runde',style:'gold',fn:startRound},
    {label:'⏹ Beenden',style:'red',fn:function(){
      setMsg('Spiel beendet.');
      setBtns([{label:'🔄 Neu starten',style:'gold',fn:function(){
        if(MP.active){ startGameMP(); } else { showSetupDialog(startGame); }
      }}]);
    }}
  ];
  if(!MP.active) nextRoundBtns.splice(1,0,{label:'⚙ Neu einrichten',style:'gray',fn:function(){showSetupDialog(startGame);}});
  // Non-host (nicht Host): Rundenende-Modal nur lesen, kein Starten
  if(MP.active&&!MP.isHost){
    showModal('Rundenende',lines.join('<br>'),[]);
    return;
  }
  showModal('Rundenende',lines.join('<br>'),nextRoundBtns);
}

// ── Chratzer allein: gewinnt Pot, alle zahlen Grundeinsatz ───
function chratzerAlone(){
  var chr=G.players[G.chratzer];
  var potWon=G.potStart;
  chr.balance+=potWon;
  addLog('⚡ Niemand geht mit – '+chr.name+' gewinnt Pot Fr. '+potWon.toFixed(2)+'!');
  G.pot=0; G.potContrib={};
  G.needsEinsatz=true; // Alle zahlen wieder Grundeinsatz
  G.geber=(G.geber-1+N)%N;
  syncState(); render();
  var lines=[
    '<strong>'+chr.name+'</strong> sagt AUF! – Niemand geht mit.',
    '✅ '+chr.name+' gewinnt den Pot: Fr. '+potWon.toFixed(2)+'.',
    '<em style="color:#ffb238">Alle zahlen nächste Runde wieder Grundeinsatz.</em>'
  ];
  var btns=[
    {label:'🃏 Nächste Runde',style:'gold',fn:startRound},
    {label:'⏹ Beenden',style:'red',fn:function(){setMsg('Spiel beendet.');setBtns([{label:'🔄 Neu starten',style:'gold',fn:function(){if(MP.active){startGameMP();}else{showSetupDialog(startGame);}}}]);}}
  ];
  if(MP.active&&!MP.isHost){showModal('Niemand mit!',lines.join('<br>'),[]);return;}
  showModal('Niemand mit!',lines.join('<br>'),btns);
}

// ── Smarter CPU: AUF!-Entscheidung ───────────────────────
function cpuDecideChratze(pi){
  if(G.chratzer!==-1){doWeg(pi);return;}
  var h=G.players[pi].hand, tr=G.trump;
  // Zähle Trumpfkarten und hohe Karten
  var trumps=h.filter(function(c){return c.suit===tr;});
  var highCards=h.filter(function(c){return c.rank<=2;}); // Ass, König, Ober
  var trumpHigh=trumps.filter(function(c){return c.rank<=2;});
  var score=evalH(h,tr);
  // AUF! nur wenn: guter Score UND mindestens 2 Trumpf UND mindestens 1 hohe Karte
  var shouldChratze=score>=2.2&&trumps.length>=2&&(highCards.length>=2||trumpHigh.length>=1);
  if(shouldChratze) doChratze(pi); else doWeg(pi);
}

// ── Smarter CPU: Mit-Entscheidung ────────────────────────
function cpuDecideMetcho(pi){
  var h=G.players[pi].hand, tr=G.trump;
  var score=evalH(h,tr);
  var trumps=h.filter(function(c){return c.suit===tr;});
  var highCards=h.filter(function(c){return c.rank<=1;}); // Ass, König
  // Mit wenn: genug Score UND mindestens 1 Trumpf oder hohe Karte
  var shouldMit=score>=1.2&&(trumps.length>=1||highCards.length>=1);
  if(shouldMit) doMetcho(pi); else doWeg_m(pi);
}

// ── Home Button / Lobby zurück ────────────────────────────
function confirmHome(){
  if(!G||!G.phase||G.phase==='start'){goHome();return;}
  showModal('Lobby verlassen?',
    'Du verlässt das aktuelle Spiel und gehst zur Lobby zurück.'+(MP.active?' <strong>Dein Platz wird aus dem Spiel entfernt.</strong>':''),
    [
      {label:'🏠 Ja, verlassen',style:'red',fn:goHome},
      {label:'Weiterspielen',style:'gold',fn:function(){}}
    ]);
}

function goHome(){
  // Firebase: Spieler entfernen / Raum aufräumen
  if(MP.active&&MP.roomRef){
    if(MP.isHost){
      // Host verlässt: Raum löschen
      MP.roomRef.remove();
    } else {
      // Spieler verlässt: sich selbst entfernen
      MP.roomRef.child('players/'+MP.myIndex).remove();
      MP.roomRef.child('disconnected/'+MP.myIndex).set(true);
    }
    if(MP.stateRef) MP.stateRef.off();
    if(MP.moveRef) MP.moveRef.off();
    if(MP.roomRef) MP.roomRef.off();
  }
  // Reset state
  MP.active=false; MP.isHost=false; MP.myIndex=0; MP.roomCode='';
  MP.roomRef=null; MP.stateRef=null; MP.moveRef=null; MP.waitingForMove=null;
  if(MP._watchdog){clearInterval(MP._watchdog);MP._watchdog=null;}
  G={phase:'start',round:0,players:[],geber:0,pot:0,potContrib:{},stock:[],trick:[],
     ansageOrder:[],ansagePtr:0,playOrder:[],playPtr:0,swapOrder:[],swapPtr:0,
     selCards:{},chratzer:-1,trump:-1,trumpCard:null,trumpCardIdx:1,
     needsEinsatz:true,tricksTotal:0,awaitingContinue:false,awaitingDiscard:-1,
     blindAufCard:null,blindAufPlayer:-1};
  // UI reset
  hideModal();
  setBtns([]); setMsg('');
  document.getElementById('home-btn').style.display='none';
  document.getElementById('scores').innerHTML='';
  document.getElementById('hand-area').innerHTML='';
  document.getElementById('trick-area').innerHTML='<div id="trick-winner"></div>';
  var circle=document.getElementById('table-circle');
  var seats=circle.querySelectorAll('.seat'); seats.forEach(function(s){circle.removeChild(s);});
  document.getElementById('round-tag').textContent='–';
  document.getElementById('pot-val').textContent='Fr. 0.00';
  // Reset lobby UI
  lobbyTab('solo');
  document.getElementById('lsec-wait').style.display='none';
  document.getElementById('lsec-solo').style.display='';
  document.getElementById('lsec-create').style.display='none';
  document.getElementById('lsec-join').style.display='none';
  document.getElementById('lstart-btn').style.display='';
  document.getElementById('lsettings-host').style.display='';
  document.getElementById('lhint').textContent='Teile den Raumcode mit deinen Freunden. Mindestens 2 Spieler zum Starten.';
  document.getElementById('lobby-player-list').innerHTML='';
  document.getElementById('lobby-overlay').style.display='flex';
}

// ── Spieler disconnect erkennen (Host) ───────────────────
function listenDisconnects(){
  if(!MP.active||!MP.isHost||!MP.roomRef) return;
  MP.roomRef.child('disconnected').on('value',function(snap){
    var disc=snap.val(); if(!disc) return;
    Object.keys(disc).forEach(function(idx){
      var i=parseInt(idx);
      if(G.players[i]&&G.players[i].isHuman){
        addLog('⚠️ '+G.players[i].name+' hat das Spiel verlassen – wird CPU.');
        G.players[i].isHuman=false;
        G.players[i].name=G.players[i].name+' (CPU)';
        MP.roomRef.child('disconnected/'+i).remove();
        // Falls aktuell auf diesen Spieler gewartet wird, weiterfahren
        if(MP.waitingForMove){
          var cb=MP.waitingForMove; MP.waitingForMove=null;
          if(MP._watchdog){clearInterval(MP._watchdog);MP._watchdog=null;}
          // CPU-Entscheidung simulieren
          if(G.phase==='blindauf') cb({type:'normal'});
          else if(G.phase==='ansage') cb({type:'weg'});
          else if(G.phase==='metcho') cb({type:'weg_m'});
          else if(G.phase==='tausch') cb({type:'tausch',indices:[]});
          else if(G.phase==='play'){
            var p2=G.players[i],legal=p2.hand.filter(function(c){return isLegal(c,p2.hand,G.trump);});
            if(!legal.length)legal=p2.hand;
            var ci=p2.hand.indexOf(legal[0]);
            cb({type:'playCard',cardIdx:ci<0?0:ci});
          }
        }
        syncState();
      }
    });
  });
}

// ── Mobile: Info-Panel Toggle ─────────────────────────────
(function(){
  var isMobile = window.matchMedia('(max-width:600px)').matches;
  if(isMobile){
    var toggleBtn = document.getElementById('info-toggle-btn');
    if(toggleBtn) toggleBtn.style.display='flex';
    var scoresBtn = document.getElementById('scores-toggle-btn');
    if(scoresBtn) scoresBtn.style.display='flex';
    document.body.classList.add('scores-collapsed'); // standardmässig eingeklappt
  }
  window.addEventListener('resize',function(){
    var m = window.matchMedia('(max-width:600px)').matches;
    var btn = document.getElementById('info-toggle-btn');
    var sbtn = document.getElementById('scores-toggle-btn');
    var panel = document.getElementById('info-panel');
    if(btn) btn.style.display = m ? 'flex' : 'none';
    if(sbtn) sbtn.style.display = m ? 'flex' : 'none';
    if(!m && panel){
      // Desktop: immer sichtbar, ohne mobile-visible class
      panel.classList.remove('mobile-visible');
      document.body.classList.remove('scores-collapsed');
    }
  });
})();

function toggleInfoPanel(){
  var panel = document.getElementById('info-panel');
  var btn = document.getElementById('info-toggle-btn');
  if(panel) panel.classList.toggle('mobile-visible');
  if(btn) btn.classList.toggle('active', panel && panel.classList.contains('mobile-visible'));
}

function toggleScores(){
  document.body.classList.toggle('scores-collapsed');
  var label=document.getElementById('scores-toggle-label');
  if(label) label.textContent = document.body.classList.contains('scores-collapsed') ? 'Stände' : 'Verbergen';
}

// ── Mobile: Karten-Größe anpassen ────────────────────────
(function(){
  function applyMobileCardSizes(){
    if(window.matchMedia('(max-width:600px)').matches){
      CW=64; CH=92; CWS=34; CHS=49; CS=34; HS=49; CT=58; HT=84;
    } else {
      CW=72; CH=104; CWS=38; CHS=55; CS=38; HS=55; CT=54; HT=78;
    }
  }
  applyMobileCardSizes();
  window.addEventListener('resize', function(){
    applyMobileCardSizes();
    if(G && G.phase && G.phase !== 'start') render();
  });
})();
